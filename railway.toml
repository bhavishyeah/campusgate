[build]
builder = "nixpacks"
buildCommand = "npm install && cd packages/shared && npx tsc && cd ../../ && npx prisma generate --schema=packages/db/prisma/schema.prisma && cd apps/api && npx tsc"

[deploy]
startCommand = "npx prisma db push --schema=packages/db/prisma/schema.prisma --accept-data-loss && node apps/api/dist/server.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
